server:
  port: 8080

spring:
  application:
    name: gym-management
  profiles:
    default: dev
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/gymdb?replicaSet=rs0}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://192.168.31.41:8081,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:supersecretkeythatisverylongandsecure32bytes}
    access-token-expiry-ms: 1800000          # 30 minutes
    refresh-token-expiry-days: 30
    registration-token-expiry-ms: 1800000    # 30 minutes
  otp:
    pepper: ${OTP_PEPPER:dev_otp_pepper_secret_key_for_hmac_sha256_1234567890}
    expiry-seconds: 300                      # 5 minutes
    resend-cooldown-seconds: 30              # 30 seconds
    max-attempts: 5
    max-sends-per-phone-per-hour: 5
    max-sends-per-ip-per-hour: 10
    max-consecutive-invalidations: 3
    phone-block-minutes: 30
    dev-fixed-code: ${OTP_DEV_FIXED_CODE:123456}
  sms:
    provider: ${SMS_PROVIDER:log}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:${MSG91_DLT_TEMPLATE_ID:}}
      sender-id: ${MSG91_SENDER_ID:GYMHLK}
      entity-id: ${MSG91_ENTITY_ID:${MSG91_DLT_ENTITY_ID:}}
      base-url: ${MSG91_BASE_URL:https://control.msg91.com/api/v5/otp}
      connect-timeout-ms: ${MSG91_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${MSG91_READ_TIMEOUT_MS:5000}
  trial:
    duration-days: 14
  super-admin:
    phone: ${SUPER_ADMIN_PHONE:}
  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.gymapp: DEBUG
    org.springframework.security: WARN
