services:
  # ── MongoDB (single-node replica set — required for multi-doc @Transactional) ──
  mongodb:
    image: mongo:7.0
    container_name: gymapp-mongo
    restart: unless-stopped
    # --replSet enables replica-set mode so Spring @Transactional works
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: gymdb
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - gymapp-net
    healthcheck:
      # Ping as root, then ensure the replica set is initiated (idempotent)
      test: >
        mongosh -u admin -p admin123 --authenticationDatabase admin --quiet --eval "
          try { rs.status().ok } catch(e) {
            rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]});
          }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── Spring Boot API ───────────────────────────────────────────────────────────
  gymapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymapp-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://gymadmin:gympass@mongodb:27017/gymdb?replicaSet=rs0
      JWT_SECRET: G3mH0l1kSuperSecretJWTKey2024MustBeAtLeast32BytesLong!
      UPLOAD_DIR: /data/uploads
    volumes:
      - upload-data:/data/uploads   # persisted member photos
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gymapp-net

volumes:
  mongo-data:
  upload-data:

networks:
  gymapp-net:
    driver: bridge
